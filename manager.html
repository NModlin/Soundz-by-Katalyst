<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music Manager · Billy Bassline</title>
<style>
body{margin:0;background:#120d0a;color:#f7eadb;font:16px system-ui,sans-serif}main{max-width:1000px;margin:0 auto;padding:32px 20px}h1{margin:0 0 6px;color:#ff8a3d}p{color:#b9a696}.panel,.track{background:#211610;border:1px solid #5a3825;border-radius:14px;padding:18px;margin:16px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}input,button{border-radius:8px;border:1px solid #6b422b;background:#160f0b;color:inherit;padding:10px}button{cursor:pointer;background:#c95d25;border-color:#e37a3f;font-weight:700}.muted{color:#9b8879;font-size:13px}.draft{border-left:4px solid #88705e}.published{border-left:4px solid #52b788}.danger{background:#5b211c;border-color:#9b3b2d}.status{padding:8px 0;min-height:20px}audio{width:100%;margin-top:12px}.track h3{margin:0}.track small{color:#b9a696}.drop{border:1px dashed #a15d37;text-align:center;padding:24px;border-radius:10px}ol{padding-left:25px}li{margin:8px 0;cursor:grab}
</style></head><body><main><h1>Music Manager</h1><p>Private Billy Bassline staging. Nothing is public until you press Publish.</p>
<section class="panel"><div class="row"><input id="token" class="grow" type="password" placeholder="Admin token"><button onclick="connect()">Unlock</button></div><div id="auth" class="status muted">Locked</div></section>
<section class="panel"><h2>Import recordings</h2><p class="muted">WAV and MP3 only. Select files or a Suno Liked folder. Imports always start as drafts.</p><div class="drop"><input id="files" type="file" accept="audio/wav,audio/mpeg,.wav,.mp3" multiple webkitdirectory></div><div id="uploads"></div><button onclick="upload()">Import as drafts</button></section>
<section class="panel"><div class="row"><h2 class="grow">Library</h2><button onclick="load()">Refresh</button></div><div id="library"><p class="muted">Unlock to load the library.</p></div></section>
<script>
let token=sessionStorage.getItem('music_token')||'';const $=id=>document.getElementById(id);$('token').value=token;
async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:`Bearer ${token}`};let r=await fetch(path,opt),d=await r.json().catch(()=>({error:r.statusText}));if(!r.ok)throw Error(d.error||'Request failed');return d}
async function connect(){token=$('token').value.trim();if(!token)return;sessionStorage.setItem('music_token',token);try{await load();$('auth').textContent='Unlocked';$('auth').className='status';}catch(e){$('auth').textContent=e.message;sessionStorage.removeItem('music_token')}}
async function load(){let d=await api('/api/manager/library');$('library').innerHTML=d.tracks.length?d.tracks.map((t,i)=>`<article class="track ${t.status}" data-id="${t.id}"><div class="row"><span class="grow"><h3>${esc(t.title)}</h3><small>${esc(t.version)} · ${t.status.toUpperCase()} · ${esc(t.original_name)}</small></span><button onclick="move('${t.id}',-1)">↑</button><button onclick="move('${t.id}',1)">↓</button><button onclick="edit('${t.id}','${esc(t.title)}','${esc(t.version)}')">Edit</button>${t.status==='published'?`<button onclick="act('${t.id}','unpublish')">Unpublish</button>`:`<button onclick="act('${t.id}','publish')">Publish</button>`}<button class="danger" onclick="removeTrack('${t.id}')">Remove</button></div><audio controls preload="none" src="/api/manager/tracks/${t.id}/audio"></audio></article>`).join(''):'<p class="muted">No recordings staged yet.</p>'}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function act(id,verb){try{await api(`/api/manager/tracks/${id}/${verb}`,{method:'POST'});await load()}catch(e){alert(e.message)}}
async function edit(id,title,version){let t=prompt('Title',title);if(t===null)return;let v=prompt('Version',version);if(v===null)return;try{await api(`/api/manager/tracks/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:t,version:v})});await load()}catch(e){alert(e.message)}}
async function removeTrack(id){if(!confirm('Remove this track from the playlist? The original recording will be preserved.'))return;try{await api(`/api/manager/tracks/${id}`,{method:'DELETE'});await load()}catch(e){alert(e.message)}}
async function move(id,delta){try{let d=await api('/api/manager/library');let ids=d.tracks.sort((a,b)=>a.position-b.position).map(t=>t.id),i=ids.indexOf(id),j=i+delta;if(j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]];await api('/api/manager/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})});await load()}catch(e){alert(e.message)}}
async function upload(){let f=[...$('files').files];if(!f.length)return alert('Choose WAV or MP3 files first');let form=new FormData;f.forEach(x=>form.append('files',x,x.name));try{await api('/api/manager/upload',{method:'POST',body:form});$('files').value='';await load()}catch(e){alert(e.message)}}
if(token)connect();
</script></main></body></html>
